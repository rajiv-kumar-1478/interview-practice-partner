[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interview-practice-partner"
version = "1.0.0"
description = "WhatsApp-based AI mock interview agent powered by FastAPI and an OpenAI-compatible LLM."
requires-python = ">=3.11"
dependencies = [
    "elevenlabs==1.50.0",
    "fastapi==0.115.5",
    "httpx==0.28.1",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "twilio==9.3.7",
    "redis[hiredis]==5.2.1",
    "openai==1.57.4",
    "tenacity==9.0.0",
    "python-multipart==0.0.20",
    "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
    "hypothesis==6.122.3",
    "fakeredis==2.26.2",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/interview_practice_partner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
no_implicit_reexport = true
